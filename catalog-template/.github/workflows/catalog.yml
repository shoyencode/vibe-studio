name: Catalog
on:
  pull_request_target:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 2
          persist-credentials: false
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r trusted/requirements.txt
      - uses: actions/checkout@v4
        with:
          ref: catalog-index
          path: published
          persist-credentials: false
      - run: python trusted/scripts/validate.py candidate trusted published/index.json
  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: catalog-publish
    permissions:
      contents: write
    concurrency: catalog-publication
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: catalog-index
          path: published
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r source/requirements.txt
      - run: python source/scripts/publish.py source published/index.json
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          cd published
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.json
          git diff --cached --quiet || git commit -m "chore(catalog): publish reviewed kit index"
          git push origin HEAD:catalog-index
