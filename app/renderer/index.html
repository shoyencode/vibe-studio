<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Vibe Studio</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/desktop.css">
  <link rel="stylesheet" href="/workshop.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <!-- Vibe Studio's native workstation layout, in its own window.
       Adds a Projects home and a Conversation space where the user follows the AI and answers its questions and permissions. -->
  <div class="workspace">
    <nav aria-label="Spaces">
      <div id="navigation"></div>
      <div class="nav-foot">
        <button id="project" class="sidebar-control project-switch" type="button"><svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M1.5 4V2.5h4l2 2h7v9h-13V4Z"/></svg><span id="project-label" class="sidebar-label">Choose a project…</span></button>
        <button id="refresh" class="sidebar-control" type="button"><svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"/></svg><span id="refresh-label">Refresh</span></button>
        <button id="settings" class="sidebar-control" type="button" title="Settings"><svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M6.4 1.5h3.2l.4 1.8 1.1.7 1.8-.5 1.6 2.8-1.4 1.2v1.2l1.4 1.2-1.6 2.8-1.8-.5-1.1.7-.4 1.8H6.4L6 12.9l-1.1-.7-1.8.5-1.6-2.8 1.4-1.2V7.5L1.5 6.3l1.6-2.8 1.8.5L6 3.3Z"/><circle cx="8" cy="8" r="2.3"/></svg><span id="settings-label">Settings</span></button>
        <div id="versions" class="versions" aria-label="Versions"></div>
      </div>
    </nav>
    <div class="content">
      <div id="notice" role="status" aria-live="polite"></div>
      <main id="main" tabindex="-1" aria-busy="true"><p>Loading…</p></main>
    </div>
  </div>
  <div id="activity" class="sr-only" aria-live="polite"></div>
  <dialog id="confirmation" aria-labelledby="confirm-title"><div id="confirm-content"></div></dialog>
</body>
</html>
