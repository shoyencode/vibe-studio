<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Vibe Studio</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/desktop.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <!-- Vibe Studio's native workstation layout, in its own window.
       Adds a Projects home and a Conversation space where the user follows the AI and answers its questions and permissions. -->
  <div class="workspace">
    <nav aria-label="Spaces">
      <div id="navigation"></div>
      <div class="nav-foot">
        <button id="project" class="project project-switch" type="button">Choose a project…</button>
        <button id="refresh" class="pill" type="button"><svg class="icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path fill="currentColor" d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"/></svg><span id="refresh-label">Refresh</span></button>
        <div id="versions" class="versions" aria-label="Versions"></div>
      </div>
    </nav>
    <div class="content">
      <div id="notice" role="status" aria-live="polite"></div>
      <main id="main" tabindex="-1" aria-busy="true"><p>Loading…</p></main>
    </div>
  </div>
  <div id="activity" class="sr-only" aria-live="polite"></div>
  <dialog id="confirmation" aria-labelledby="confirm-title"><div id="confirm-content"></div></dialog>
</body>
</html>
